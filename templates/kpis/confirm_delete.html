{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body text-center py-5">
  <i class="bx bx-trash text-danger" style="font-size:4rem"></i>
  <h4 class="mt-3">Delete KPI?</h4>
  <p class="text-muted mb-4">Delete <strong>{{ kpi.name }}</strong>? All employee assignments for this KPI will also be removed.</p>
  <form method="post">{% csrf_token %}
    <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
    <a href="{% url 'kpi_list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
