{% extends 'base.html' %}
{% block title %}{{ title }} - KPITrack{% endblock %}
{% block content %}
<div class="mb-4">
  <nav aria-label="breadcrumb"><ol class="breadcrumb mb-1"><li class="breadcrumb-item"><a href="{% url 'goal_list' %}">Goals</a></li><li class="breadcrumb-item active">{{ title }}</li></ol></nav>
  <h4 class="fw-bold mb-0">{{ title }}</h4>
</div>
<div class="card"><div class="card-body">
  <form method="post">{% csrf_token %}
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">Goal Title <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" value="{{ form.title.value|default:'' }}" required placeholder="e.g., Increase customer satisfaction score">
      </div>
      <div class="col-md-6">
        <label class="form-label">Employee <span class="text-danger">*</span></label>
        <select name="employee" class="form-select" required>
          <option value="">Select employee...</option>
          {% for v,l in form.employee.field.choices %}{% if v %}<option value="{{ v }}" {% if form.employee.value|stringformat:"s" == v|stringformat:"s" %}selected{% endif %}>{{ l }}</option>{% endif %}{% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Priority</label>
        <select name="priority" class="form-select">
          {% for v,l in form.priority.field.choices %}<option value="{{ v }}" {% if form.priority.value == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
          {% for v,l in form.status.field.choices %}<option value="{{ v }}" {% if form.status.value == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Due Date <span class="text-danger">*</span></label>
        <input type="date" name="due_date" class="form-control" value="{{ form.due_date.value|default:'' }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Progress: <span id="prog-label">{{ form.progress.value|default:'0' }}%</span></label>
        <input type="range" name="progress" class="form-range" min="0" max="100" value="{{ form.progress.value|default:'0' }}" oninput="document.getElementById('prog-label').textContent=this.value+'%'">
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3" placeholder="Describe what success looks like...">{{ form.description.value|default:'' }}</textarea>
      </div>
    </div>
    <div class="mt-4 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save Goal</button>
      <a href="{% url 'goal_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
